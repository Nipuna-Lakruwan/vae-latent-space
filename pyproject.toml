[project]
name = "vae-latent-space"
version = "0.1.0"
description = "A convolutional variational autoencoder from scratch in PyTorch: latent maps, interpolation and an importance-sampled likelihood on Fashion-MNIST"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.5",
    "torchvision>=0.20",
    "numpy>=2.0",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "pillow>=10",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
